apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: dtrevino0630/ml_app:1.0
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          value: redis-db
        command: ["python", "/code/salamanders_api.py"]

