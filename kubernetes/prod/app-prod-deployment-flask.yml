apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: <dockerhub-user>/salamander-api:latest
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          value: "redis-db"
        - name: REDIS_PORT
          value: "6379"

