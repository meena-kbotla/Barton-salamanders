apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: your_dockerhub_username/salamander-api:latest
        command: ["python", "worker.py"]
        env:
        - name: REDIS_HOST
          value: "redis-db"
        - name: REDIS_PORT
          value: "6379"

